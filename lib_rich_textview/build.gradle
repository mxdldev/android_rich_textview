apply plugin: 'com.android.library'
apply plugin: 'maven' // 使用 maven 插件

android {
    compileSdkVersion 30

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'com.android.support:appcompat-v7:28.0.0'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    compile 'com.github.bumptech.glide:glide:3.7.0'
    api 'com.github.softwee:codeview-android:1.2.0'
}
// 配置发布任务
uploadArchives {
    repositories {
        mavenDeployer {
            repository(url: uri("${buildDir}/repo")) // 本地发布路径，可以改为远程仓库地址
            pom.groupId = 'com.github.mxdldev' // 替换为你的 GitHub 用户名
            pom.artifactId = 'android_rich_textview' // 替换为你的库名称
            pom.version = '1.0.4' // 替换为你的版本号
        }
    }
}